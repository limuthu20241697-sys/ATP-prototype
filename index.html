<!doctype html>
<html lang="en">
<head>
  <!-- PART 1 (Menula De Pinto) · FOUNDATION. Page title, search-engine description, social-share preview (og: tags), the three fonts (Syne, Instrument Serif, Inter) and the two stylesheets. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Every live night in Sri Lanka in one place. Walk through the room in 3D before you buy. Find your next night with Void.">
  <title>Void · Live events in Sri Lanka, seen in 3D</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Void">
  <meta property="og:title" content="Void · Live events in Sri Lanka, seen in 3D">
  <meta property="og:description" content="Every live night in Sri Lanka in one place. Walk through the room in 3D before you buy.">
  <meta property="og:image" content="assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Void star logo and the line: Step into the void.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Instrument+Serif:ital@0;1&family=Bodoni+Moda:wght@800&family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body>
  <!-- PART 1 (Menula De Pinto) · SKIP LINK + NAV BAR. The skip link lets keyboard users jump past the menu.
       The nav bar itself is built by renderChrome() in shared.js and placed in the empty #nav div. -->
  <a class="skip" href="#main">Skip to main content</a>
  <div id="nav"></div>

  <main id="main" tabindex="-1">
    <!-- PART 4 (Hansadi) · EVENT LIST. The filter bar (search, date, city, genre, price, sort) and the grid of event cards.
         The cards are drawn by renderGrid() in events-list.js from the events list in shared.js.
         Only the first 6 show here (data-limit="6"); the "More Events" button opens events.html with all of them. -->
    <section class="discover" id="events" aria-labelledby="discoverTitle">
      <p class="giant giant-bg" aria-hidden="true">EVENTS</p>
      <div class="wrap">
        <div class="head">
          <div>
            <p class="eyebrow"><b>02</b> / What's on</p>
            <h2 id="discoverTitle">Find your next <em>experience</em></h2>
          </div>
          <p class="result-count" id="resultCount" aria-live="polite">8 events / Sri Lanka</p>
        </div>

        <form class="filters" id="filters" role="search">
          <label class="f-search"><span>Search</span>
            <input id="q" name="q" type="search" placeholder="Find your next night…" autocomplete="off" spellcheck="false">
          </label>
          <label><span>Date</span>
            <select id="date" name="date">
              <option value="">Any date</option><option value="2027-02">February 2027</option><option value="2027-03">March 2027</option><option value="2027-04">April 2027</option><option value="2027-05">May 2027</option>
            </select>
          </label>
          <label><span>City</span>
            <select id="city" name="city">
              <option value="">All cities</option><option>Colombo</option><option>Mirissa</option><option>Kandy</option><option>Galle</option>
            </select>
          </label>
          <label><span>Genre</span>
            <select id="genre" name="genre">
              <option value="">All genres</option><option>Electronic</option><option>Live music</option><option>Jazz</option>
            </select>
          </label>
          <label><span>Price</span>
            <select id="price" name="price">
              <option value="">Any price</option><option value="3000">Under LKR 3,000</option><option value="5000">Under LKR 5,000</option><option value="10000">Under LKR 10,000</option>
            </select>
          </label>
          <label><span>Sort</span>
            <select id="sort" name="sort">
              <option value="date">Soonest first</option><option value="price">Price: low to high</option>
            </select>
          </label>
        </form>

        <div class="grid" id="grid" data-limit="6"></div>
        <div class="more" id="moreWrap" hidden>
          <p id="moreCount" aria-live="polite"></p>
          <a class="btn btn-line" id="more" href="events.html">More Events</a>
        </div>
        <div class="empty" id="empty" hidden>
          <p>No events match these filters.</p>
          <button class="btn btn-line" id="reset" type="button">Reset Filters</button>
        </div>
      </div>
    </section>

  </main>

  <!-- PART 1 (Menula De Pinto) · FOOTER. Built by renderChrome() in shared.js. shared.js also holds the pop-up windows (Contact, Policies, Privacy, FAQ). -->
  <div id="footer"></div>
  <script src="shared.js"></script>
  <script src="events-list.js"></script>
  <script src="script.js"></script>
</body>
</html>
