<!doctype html>
<html lang="en">
<head>
  <!-- PART 1 (Menula De Pinto) · FOUNDATION. Page title, search-engine description, social-share preview (og: tags) and the fonts (Syne, Instrument Serif, Bodoni Moda, Inter).
       Every page of the site is drawn by React into #root (see src/main.jsx); each page sets its own title as it opens. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Every live night in Sri Lanka in one place. Walk through the room in 3D before you buy. Find your next night with Void.">
  <title>Void · Live events in Sri Lanka, seen in 3D</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Void">
  <meta property="og:title" content="Void · Live events in Sri Lanka, seen in 3D">
  <meta property="og:description" content="Every live night in Sri Lanka in one place. Walk through the room in 3D before you buy.">
  <meta property="og:image" content="/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Void star logo and the line: Step into the void.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Instrument+Serif:ital@0;1&family=Bodoni+Moda:wght@800&family=Inter:wght@400..700&display=swap">
</head>
<body>
  <div id="root"></div>
  <noscript>Void needs JavaScript turned on to show its events.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
