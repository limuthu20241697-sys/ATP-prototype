<!doctype html>
<html lang="en">
<head>
  <!-- PART 4 (Hansadi) · FOUNDATION. Page title, search-engine description, social-share preview (og: tags), the three fonts (Syne, Instrument Serif, Inter) and the two stylesheets. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Every venue on Void, with what is on there and directions to get there.">
  <title>Venues · Void</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Void">
  <meta property="og:title" content="Void · Live events in Sri Lanka, seen in 3D">
  <meta property="og:description" content="Every live night in Sri Lanka in one place. Walk through the room in 3D before you buy.">
  <meta property="og:image" content="assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Void star logo and the line: Step into the void.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body data-page="venues">
  <a class="skip" href="#main">Skip to main content</a>
  <div id="nav"></div>

  <main id="main" tabindex="-1">
    <!-- PART 4 (Hansadi) · VENUES PAGE. One card per venue, drawn by venues.js from the events list in shared.js.
         Each card has a "Get directions" link that opens the route in Google Maps. -->
    <section class="discover discover-page" aria-labelledby="venuesTitle">
      <p class="giant giant-bg" aria-hidden="true">VENUES</p>
      <div class="wrap">
        <p class="back"><a href="index.html"><span aria-hidden="true">←</span> Back to home</a></p>
        <div class="head">
          <div>
            <p class="eyebrow">Where it happens</p>
            <h1 id="venuesTitle">Spaces worth <em>showing up for</em></h1>
          </div>
          <p class="result-count" id="venueCount">Venues / Sri Lanka</p>
        </div>
        <div class="venue-grid" id="venueGrid"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="shared.js"></script>
  <script>renderChrome();</script>
  <script src="venues.js"></script>
</body>
</html>
