<!doctype html>
<html lang="en">
<head>
  <!-- PART 3 (Limuthu Liyanage) · SIGN-UP PAGE. The same fonts, styles, nav and footer as the home page. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Sign up to Void and be first to hear when tickets open for live events in Sri Lanka.">
  <title>Sign up · Void</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body data-page="signup">
  <a class="skip" href="#main">Skip to main content</a>
  <div id="nav"></div>

  <main id="main" tabindex="-1">
    <!-- PART 3 (Limuthu Liyanage) · Two halves: a picture side with the tagline on the left, the form on the right.
         The form is checked by signup.js; nothing is sent anywhere. -->
    <section class="signup" aria-labelledby="signupTitle">
      <div class="signup-art" aria-hidden="true">
        <div class="stars"></div>
        <img src="assets/photos/void-portal.webp" alt="" width="540" height="540">
        <p>Great nights.<br><em>Better together.</em></p>
      </div>

      <div class="signup-panel" id="signupPanel">
        <p class="eyebrow">Join Void</p>
        <h1 id="signupTitle">Create your <em>account</em></h1>
        <p class="signup-sub">Be first to hear when tickets open, and keep every pass in one place.</p>

        <form class="signup-form" id="signupForm" novalidate>
          <label class="field" for="suName">Full name
            <input class="control" id="suName" name="name" type="text" autocomplete="name" aria-describedby="suNameError">
          </label>
          <p class="field-error" id="suNameError" aria-live="polite"></p>

          <label class="field" for="suEmail">Email address
            <input class="control" id="suEmail" name="email" type="email" autocomplete="email" spellcheck="false" aria-describedby="suEmailError">
          </label>
          <p class="field-error" id="suEmailError" aria-live="polite"></p>

          <label class="field" for="suPassword">Password
            <span class="password">
              <input class="control" id="suPassword" name="password" type="password" autocomplete="new-password" aria-describedby="suPasswordError">
              <button type="button" data-show="suPassword" aria-pressed="false" aria-label="Show password">Show</button>
            </span>
          </label>
          <p class="field-error" id="suPasswordError" aria-live="polite"></p>

          <label class="field" for="suPassword2">Confirm password
            <span class="password">
              <input class="control" id="suPassword2" name="password2" type="password" autocomplete="new-password" aria-describedby="suPassword2Error">
              <button type="button" data-show="suPassword2" aria-pressed="false" aria-label="Show password">Show</button>
            </span>
          </label>
          <p class="field-error" id="suPassword2Error" aria-live="polite"></p>

          <label class="field" for="suCity">Your city
            <select class="control" id="suCity" name="city">
              <option>Colombo</option><option>Kandy</option><option>Galle</option><option>Mirissa</option><option>Somewhere else</option>
            </select>
          </label>

          <fieldset class="signup-likes">
            <legend>What are you into?</legend>
            <label><input type="checkbox" name="genre" value="Electronic"> Electronic</label>
            <label><input type="checkbox" name="genre" value="Live music"> Live music</label>
            <label><input type="checkbox" name="genre" value="Jazz"> Jazz</label>
          </fieldset>

          <label class="check" for="suTerms"><input type="checkbox" id="suTerms" aria-describedby="suTermsError"><span>I agree to the <button type="button" data-info="Privacy Notice">Privacy Notice</button>.</span></label>
          <p class="field-error" id="suTermsError" aria-live="polite"></p>

          <button class="btn btn-primary btn-wide btn-lg" type="submit">Create Account</button>
          <p class="signup-note">Prototype only: nothing you type leaves your browser.</p>
        </form>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="shared.js"></script>
  <script>renderChrome();</script>
</body>
</html>
